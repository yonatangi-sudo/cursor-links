<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Deep dive with AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; transition:background 0.2s; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for the Service daily message.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" href="cursor://anysphere.cursor-deeplink/prompt?text=I%27m%20looking%20at%20the%20monday%20Service%20daily%20data%20message%20%28%23monday-service-data%29.%0A%0AWhat%20would%20you%20like%20to%20understand%20about%20this%20data%3F">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard</small>
  </div>
  <script>
    function copyToClaude() {
      var prompt = decodeURIComponent('I%27m%20looking%20at%20the%20monday%20Service%20daily%20data%20message%20%28%23monday-service-data%29.%0A%0AWhat%20would%20you%20like%20to%20understand%20about%20this%20data%3F');
      navigator.clipboard.writeText(prompt);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = 'Copy to Claude →'; btn.classList.remove('copied'); }, 2000);
    }
  </script>
</body>
</html>
