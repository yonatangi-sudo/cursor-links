<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Deep dive with AI</title>
  <!-- prompt-version: 2 -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; transition:background 0.2s; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for Service daily data message.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" id="cursorLink" href="#">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard · v2</small>
  </div>
  <script>
    var PROMPT = "I'm looking at the monday Service daily data Slack message (#monday-service-data).\n\nNotification: production Service daily pulse (notifications-system id b8749971-475e-4ba3-b838-e50d7f6d7d66)\nChannel: #monday-service-data\nMaintainer scripts: playground/analysis/2026-06-16_slack_notifier_kr_audit/ (push_daily_notification.py, publish_daily_sms_queries.py)\nKR SQL alignment: playground/analysis/2026-05-14_kr_dashboard_gas/kr_dashboard_sql.py\nRedash query ids: mapped in playground/analysis/2026-06-16_slack_notifier_kr_audit/daily_query_id_mapping.json (Added ARR, Served Users, AI Resolutions, AI Involved, Healthy Accounts, paying accounts, ARR totals, loss ARR, opps, signup intent, agent funnel, portal, SLA, Sidekick, etc.)\n\nThis daily message is the Service heartbeat pulse \u2014 OKR KRs, ARR, adoption / funnel deepdives powered by pinned Redash queries. Definitions must match the KR dashboard / cookbook for each line (do not mix Part A vs Part B casually).\n\nRelated: Redash Service Daily Numbers dashboard 4458 (service-daily-numbers.html); KR Dashboard GAS.\n\nBefore answering any question:\n1. Resolve each metric from the Redash query SQL / kr_dashboard_sql.py / service-analytics_v3 data-cookbook (Tier 1 when available) \u2014 use those definitions; do not reinvent KR formulas.\n2. For drill-downs, run the same Snowflake logic (or scoped variants) via snow sql; confirm pins/schedules if Slack shows query errors.\n3. Do not speculate about numbers -- always query the data first.\n\nWhat would you like to understand about this data? Or phrase a freestyle question \u2014 I'll ask for clarifications if needed.\n";
    document.getElementById('cursorLink').href = 'cursor://anysphere.cursor-deeplink/prompt?text=' + encodeURIComponent(PROMPT);
    function copyToClaude() {
      navigator.clipboard.writeText(PROMPT);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = 'Copy to Claude →'; btn.classList.remove('copied'); }, 2000);
    }
  </script>
</body>
</html>
