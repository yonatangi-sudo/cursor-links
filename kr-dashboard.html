<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Deep dive with AI</title>
  <!-- prompt-version: 4 -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for the monday service KR Dashboard.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" id="cursorLink" href="#">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard · v4</small>
  </div>
  <script>
    var PROMPT = "I'm looking at the monday service KR Dashboard (Z2H).\n\nApp: \"kr-dashboard\"\nURL: https://bigbrain.me/bigbrain-vibe/kr-dashboard\nLegacy GAS (same metrics): https://script.google.com/a/macros/monday.com/s/AKfycbzx7DQvDBun-NTKmoHOsWlqRh9sfdczeC5ZQtH8rPaO80lvpSF_fhGPJi6c4NaYVFjpWA/exec\nSource folder: ~/zth-projects/kr-dashboard\nCanonical SQL: playground/analysis/2026-05-14_kr_dashboard_gas/kr_dashboard_sql.py (LOGIC_VERSION kr_dashboard_v3.1)\nRegistry: playground/dashboards/kr-dashboard-q2-gas/DESCRIPTION.md\nData cache: n8n workflow 6MCTghqZeDdIwB4U \u2014 GET https://n8n.bigbrain.me/webhook/kr-dashboard-data (hourly refresh)\n\nThis dashboard tracks company KRs for monday service with a Q2/Q3 toggle: Served Users (cumulative QTD), Healthy Accounts (QTD daily avg of 61\u201390d util\u226560% + 28d ticket gate), AI Involved Tickets (cumulative QTD), and AI Resolved Tickets (cumulative QTD). Charts include pace-to-target curves. Q2 is frozen EOQ; Q3 is live.\n\nCookbook definitions (Tier 1):\n- Served Users: service-analytics_v3/data-cookbook/domainsOS/product/service/references/served_users_kr.sql\n- Healthy Accounts: .../healthy_accounts_kr.sql\n- AI Resolved: .../ai_auto_resolved_tickets_kr.sql\n- AI Involved: .../ai_involved_tickets_kr.sql\nAlignment notes: playground/analysis/2026-05-14_kr_dashboard_gas/ALIGNMENT.md\n\nQ3 2026 targets: Served Users 470K \u00b7 Healthy Accounts 42% \u00b7 AI Resolved 2K \u00b7 AI Involved 10K.\n\nBefore answering any question:\n1. Resolve canonical definitions from the cookbook paths above (and ALIGNMENT.md) \u2014 do not reinvent KR logic from the UI alone.\n2. For deeper cuts, run the SQL in kr_dashboard_sql.py (or the matching cookbook references) in Snowflake; prefer snow CLI, Kramer MCP as fallback for lineage.\n3. Do not speculate about numbers \u2014 always query the data first.\n\nWhat would you like to understand about this data? Or phrase a freestyle question \u2014 I'll ask for clarifications if needed.";
    document.getElementById('cursorLink').href =
      'cursor://anysphere.cursor-deeplink/prompt?text=' + encodeURIComponent(PROMPT);
    function copyToClaude() {
      navigator.clipboard.writeText(PROMPT);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function () {
        btn.textContent = 'Copy to Claude →';
        btn.classList.remove('copied');
      }, 2000);
    }
  </script>
</body>
</html>
