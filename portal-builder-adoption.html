<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Deep dive with AI</title>
  <!-- prompt-version: 1 -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; transition:background 0.2s; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for Portal Builder adoption.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" id="cursorLink" href="#">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard · v1</small>
  </div>
  <script>
    var PROMPT = "I'm looking at the Portal Builder adoption app.\n\nApp: \"Portal Builder adoption\"\nURL: https://bigbrain.me/bigbrain-vibe/portal-builder-adoption\nDatasource / SQL: BIGBRAIN.FINAL.events via app handlers under ~/zth-projects/portal-builder-adoption/backend/handlers/widget_query_*.js\nRelated spec: Slack canvas https://monday.slack.com/docs/T024J3LAA/F0BJJ6TCKH9 (Portal Builder \u2014 Event Spec & Gaps P0/P1)\n\nThis app monitors visual portal-builder adoption for external Service accounts (pulse_account_id <> 5, domain not @monday.com), last 30 days, refresh every 2 hours while open:\n- Entries: ms_cta_clicked (customize_portal / go_to_editor) or ms_page_entered (kind=portal_builder_editor)\n- Activity: portal object created/deleted/duplicated/modified/restored + announcement create/update/delete\n- Publications: ms_cta_clicked kind=publish with detailed_location=portal_builder (success-only emit in editor code)\n- Daily trend: event counts (not accounts) for the three signals\n- Instrumentation health: per-event volume + % with detailed_location=portal_builder\n- Top accounts by activity volume\n\nKnown instrumentation gaps (as of 2026-09-16): Entries and Publications are often 0 in Snowflake even though editor code emits publish + page_entered \u2014 treat zeros as possible telemetry lag/rollout, not true zero adoption. object_created/deleted/duplicated still often miss framework props (0% portal_builder). object_modified and announcements typically have framework fill.\n\nBefore answering any question:\n1. Resolve definitions from the canvas + the SQL in ~/zth-projects/portal-builder-adoption/backend/handlers/ \u2014 do not invent alternate event names.\n2. For deeper cuts, query BIGBRAIN.FINAL.events in Snowflake with the same cohort filters; use snow CLI (monday-sso) when available.\n3. Do not speculate about numbers \u2014 always query the data first. Flag when Entries/Publications are empty due to missing telemetry vs true zero usage.\n\nWhat would you like to understand about this data? Or phrase a freestyle question \u2014 I'll ask for clarifications if needed.";
    document.getElementById('cursorLink').href =
      'cursor://anysphere.cursor-deeplink/prompt?text=' + encodeURIComponent(PROMPT);
    function copyToClaude() {
      navigator.clipboard.writeText(PROMPT);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function () {
        btn.textContent = 'Copy to Claude →';
        btn.classList.remove('copied');
      }, 2000);
    }
  </script>
</body>
</html>
