<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Deep dive with AI</title>
  <!-- prompt-version: 1 -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; transition:background 0.2s; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for Service Closed-Won book ARR alert.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" id="cursorLink" href="#">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard · v1</small>
  </div>
  <script>
    var PROMPT = "I'm looking at the Service Closed-Won hourly Slack alert (book-aligned Service ARR).\n\nWorkflow: n8n \"Service CW Book ARR \u2014 Hourly Slack Alert\" (https://n8n.bigbrain.me/workflow/2GTP1k4xteWLMXEP)\nCanonical SQL / flow: service-analytics_v3/n8n-flows/service-cw-book-arr-slack-alert/ (cw_service_hourly.sql, create_n8n_workflow.py)\nSent table: BIGBRAIN.PLAYGROUND.SERVICE_CW_ALERT_SENT\nPlayground pointer: playground/analysis/2026-08-09_service_cw_slack_alert/\n\nThis alert posts newly closed-won Service deals with book-aligned Service ARR \u0394 (quote Service product ARR expected \u2212 prior), not Salesforce Service Attributed ARR. Layout mirrors the Salesforce CW card (opp name, account+id, Service ARR \u0394/total, monday ARR total, region, owner, overlay, partner, SE). Co-sell dedupe: one row per account + opp name + close + Service ARR.\n\nBefore answering any question:\n1. Read cw_service_hourly.sql and create_n8n_workflow.py FORMAT_JS \u2014 use those field definitions; do not swap in SF attributed ARR without labeling.\n2. For drill-downs, query Snowflake for the opportunity / account ARR path used in that SQL (same book \u0394 family as daily Total ARR). Prefer snow sql.\n3. Do not speculate about numbers -- always query the data first.\n\nWhat would you like to understand about this data? Or phrase a freestyle question \u2014 I'll ask for clarifications if needed.\n";
    document.getElementById('cursorLink').href = 'cursor://anysphere.cursor-deeplink/prompt?text=' + encodeURIComponent(PROMPT);
    function copyToClaude() {
      navigator.clipboard.writeText(PROMPT);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = 'Copy to Claude →'; btn.classList.remove('copied'); }, 2000);
    }
  </script>
</body>
</html>
