<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Deep dive with AI</title>
  <!-- prompt-version: 4 -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; transition:background 0.2s; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for Service TOF Dashboard.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" href="cursor://anysphere.cursor-deeplink/prompt?text=I%27m%20looking%20at%20the%20Service%20TOF%20workbook%20on%20Tableau.%0A%0AWorkbook%3A%20%22Service%20TOF%22%0AURL%3A%20https%3A%2F%2Ftableau.bigbrain.me%2F%23%2Fviews%2FServiceTOF%2FDashboard1%0ADashboard%3A%20%22Leads%20TOF%22%20%28view%20name%3A%20Dashboard1%29%0ADatasource%3A%20%22Leads%20Overview%22%20%28embedded%20extract%2C%20refreshes%20daily%29%0A%0AThis%20dashboard%20tracks%20the%20service%20leads%20funnel%20--%20from%20submission%20through%20lead%20cycle%20stages%20to%20opportunity%20creation%20and%20close%20%282025%2B%20data%29.%0A%0AOther%20dashboards%20in%20this%20workbook%3A%20Funnel%20Comparison%2C%20Service%20Campaign%20Monitoring%2C%20Email%20Campaigns%20Engagement%2C%20Email%20Campaigns%20Non%20Direct%20Impact%2C%20Raw%20Service%20Campaign%20Leads%2C%20CS%20Submission%20Funnel.%0A%0ABefore%20answering%20any%20question%3A%0A1.%20Look%20up%20the%20workbook%27s%20calculated%20fields%20and%20their%20formulas%20using%20the%20Tableau%20Metadata%20API%20%28sign%20in%20with%20PAT%2C%20then%20query%20embeddedDatasources%20fields%20for%20workbook%20LUID%20e16e0486-cc24-4116-a830-8abe27b53d98%29.%20Use%20the%20same%20field%20definitions%20the%20dashboard%20uses%20--%20do%20not%20reinvent%20calculations.%0A2.%20For%20drill-downs%20or%20analysis%20beyond%20the%20dashboard%27s%20fields%2C%20resolve%20the%20underlying%20custom%20SQL%20query%20powering%20this%20datasource%20%28query%20customSQLTables%20with%20minimal%20fields%3A%20%7B%20name%20query%20downstreamWorkbooks%20%7B%20luid%20%7D%20%7D%2C%20filter%20by%20the%20workbook%20LUID%29.%20Run%20that%20SQL%20in%20Snowflake%20for%20deeper%20cuts.%0A3.%20Do%20not%20speculate%20about%20numbers%20--%20always%20query%20the%20data%20first.%0A%0AWhat%20would%20you%20like%20to%20understand%20about%20this%20data%3F">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard · v4</small>
  </div>
  <script>
    var PROMPT = "I'm looking at the Service TOF workbook on Tableau.\n\nWorkbook: \"Service TOF\"\nURL: https://tableau.bigbrain.me/#/views/ServiceTOF/Dashboard1\nDashboard: \"Leads TOF\" (view name: Dashboard1)\nDatasource: \"Leads Overview\" (embedded extract, refreshes daily)\n\nThis dashboard tracks the service leads funnel -- from submission through lead cycle stages to opportunity creation and close (2025+ data).\n\nOther dashboards in this workbook: Funnel Comparison, Service Campaign Monitoring, Email Campaigns Engagement, Email Campaigns Non Direct Impact, Raw Service Campaign Leads, CS Submission Funnel.\n\nBefore answering any question:\n1. Look up the workbook's calculated fields and their formulas using the Tableau Metadata API (sign in with PAT, then query embeddedDatasources fields for workbook LUID e16e0486-cc24-4116-a830-8abe27b53d98). Use the same field definitions the dashboard uses -- do not reinvent calculations.\n2. For drill-downs or analysis beyond the dashboard's fields, resolve the underlying custom SQL query powering this datasource (query customSQLTables with minimal fields: { name query downstreamWorkbooks { luid } }, filter by the workbook LUID). Run that SQL in Snowflake for deeper cuts.\n3. Do not speculate about numbers -- always query the data first.\n\nWhat would you like to understand about this data?";
    function copyToClaude() {
      navigator.clipboard.writeText(PROMPT);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = 'Copy to Claude →'; btn.classList.remove('copied'); }, 2000);
    }
  </script>
</body>
</html>
