<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Deep dive with AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; }
    .card { background:white; border-radius:12px; padding:40px 48px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.1); max-width:480px; }
    h2 { margin:0 0 8px; color:#181B34; }
    p { color:#6B7B8D; margin:0 0 28px; }
    .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; background:#6161FF; color:white; text-decoration:none; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; }
    a.btn:hover { background:#4b4bdd; }
    button.btn-claude { display:inline-block; background:#D97706; color:white; border:none; cursor:pointer; padding:14px 32px; border-radius:8px; font-weight:600; font-size:16px; transition:background 0.2s; }
    button.btn-claude:hover { background:#b45309; }
    button.btn-claude.copied { background:#16a34a; }
    small { display:block; margin-top:16px; color:#aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Deep dive with AI</h2>
    <p>Opens an AI analysis session for Service Campaign Monitoring.<br>Just type your question in the prompt.</p>
    <div class="buttons">
      <a class="btn" href="" id="cursorLink">Open in Cursor →</a>
      <button class="btn-claude" onclick="copyToClaude()">Copy to Claude →</button>
    </div>
    <small>Cursor requires the app installed · Claude copies prompt to clipboard · v1</small>
  </div>
  <script>
    var PROMPT = "I'm looking at the Service Campaign Monitoring dashboard on Tableau.\n\nWorkbook: \"Service TOF\"\nURL: https://tableau.bigbrain.me/#/views/ServiceTOF/ServiceCampaignMonitoring\nDashboard: \"Service Campaign Monitoring\" (view name: ServiceCampaignMonitoring)\nDatasource: \"Sales Agent Overview\" (embedded extract, refreshes daily)\n\nThis dashboard tracks service campaign performance -- monitoring campaign-level metrics, lead generation by campaign, conversion rates, and campaign ROI across the service leads funnel.\n\nOther dashboards in this workbook: Leads TOF (Dashboard1), Funnel Comparison, Email Campaigns Engagement, Email Campaigns Non Direct Impact, Raw Service Campaign Leads, CS Submission Funnel.\n\nBefore answering any question:\n1. Look up the workbook's calculated fields and their formulas using the Tableau Metadata API (sign in with PAT, then query embeddedDatasources fields for workbook LUID e16e0486-cc24-4116-a830-8abe27b53d98). Use the same field definitions the dashboard uses -- do not reinvent calculations.\n2. For drill-downs or analysis beyond the dashboard's fields, resolve the underlying custom SQL query powering this datasource (query customSQLTables with minimal fields: { name query downstreamWorkbooks { luid } }, filter by the workbook LUID). Run that SQL in Snowflake for deeper cuts.\n3. Do not speculate about numbers -- always query the data first.\n\nWhat would you like to understand about this data?";
    var encoded = encodeURIComponent(PROMPT);
    document.getElementById('cursorLink').href = "cursor://anysphere.cursor-deeplink/prompt?text=" + encoded;
    function copyToClaude() {
      navigator.clipboard.writeText(PROMPT);
      var btn = document.querySelector('.btn-claude');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function(){ btn.textContent = 'Copy to Claude →'; btn.classList.remove('copied'); }, 2000);
    }
  </script>
</body>
</html>
